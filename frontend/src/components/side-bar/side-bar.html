<nav class="sidebar" aria-label="Fő navigáció">
  <button
    type="button"
    class="toggle"
    (click)="toggle()"
    [attr.aria-expanded]="!collapsed()"
    [attr.aria-label]="collapsed() ? 'Oldalsáv kinyitása' : 'Oldalsáv összecsukása'"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
  </button>

  <ul class="nav-list">
    @for (item of items; track item.route) {
      <li>
        @if (item.disabled) {
          <span
            class="nav-item disabled"
            [attr.title]="item.label + ' (hamarosan)'"
            aria-disabled="true"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
            <span class="label">{{ item.label }}</span>
          </span>
        } @else {
          <a
            class="nav-item"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/' }"
            [attr.title]="collapsed() ? item.label : null"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
            <span class="label">{{ item.label }}</span>
          </a>
        }
      </li>
    }
  </ul>
</nav>
